# FluidSynth setup for m00Dr: plays chords (ch1) and arp (ch3). Bass (ch2) is
# the reese synth (reese.py, user service m00dr-reese) and acid (ch5) is left to
# Open303/JC303, so the router passes channels 1 and 3 only (0 and 2 here,
# FluidSynth counts from 0) and drops everything else.
router_clear
router_begin note
router_chan 0 0 1 0
router_end
router_begin note
router_chan 2 2 1 0
router_end
router_begin cc
router_chan 0 0 1 0
router_end
router_begin cc
router_chan 2 2 1 0
router_end
router_begin prog
router_chan 0 0 1 0
router_end
router_begin prog
router_chan 2 2 1 0
router_end
router_begin pbend
router_chan 0 0 1 0
router_end
router_begin pbend
router_chan 2 2 1 0
router_end
router_begin cpress
router_chan 0 0 1 0
router_end
router_begin cpress
router_chan 2 2 1 0
router_end
router_begin kpress
router_chan 0 0 1 0
router_end
router_begin kpress
router_chan 2 2 1 0
router_end

# Chords (ch1) and arp (ch3) use gamebreaks.sf2: stabs built from the gamestabs
# samples, plus a looped synth. It loads as font 2 with bank offset 1 so its
# presets don't shadow GeneralUser's GM programs. `select <chan> 2 1 <preset>`:
# 0 smet_nor3, 1 toa_f, 2 toa_fm2, 3 toa_lif, 4 toa_ns, 5 toa_oue,
# 6 tyr_sav, 7 tyr_sav2, 8 vk_cfh2, 9 vk_sos (one-shot stabs),
# 10 phase_sine (sustained sine, soft-clipped, through a 1.6 s phaser sweep).
# (Back to GM: `prog 0 4` for chords, `prog 2 11` for arp.) After a change,
# `systemctl --user restart m00dr-fluidsynth`.
load /home/emin0r/code/m800Dr/synths/gamebreaks.sf2 0 1
select 0 2 1 10
select 2 2 1 0

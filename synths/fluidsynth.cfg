# FluidSynth setup for m00Dr: plays chords (ch1), arp (ch3) and drums (ch4).
# Bass (ch2) is the reese synth (reese.py, user service m00dr-reese) and acid
# (ch5) is left to Open303/JC303, so the router passes channels 1, 3 and 4
# only (0, 2 and 3 here, FluidSynth counts from 0) and drops everything else.
router_clear
router_begin note
router_chan 0 0 1 0
router_end
router_begin note
router_chan 2 2 1 0
router_end
router_begin note
router_chan 3 3 1 0
router_end
router_begin cc
router_chan 0 0 1 0
router_end
router_begin cc
router_chan 2 2 1 0
router_end
router_begin cc
router_chan 3 3 1 0
router_end
router_begin prog
router_chan 0 0 1 0
router_end
router_begin prog
router_chan 2 2 1 0
router_end
router_begin prog
router_chan 3 3 1 0
router_end
router_begin pbend
router_chan 0 0 1 0
router_end
router_begin pbend
router_chan 2 2 1 0
router_end
router_begin pbend
router_chan 3 3 1 0
router_end
router_begin cpress
router_chan 0 0 1 0
router_end
router_begin cpress
router_chan 2 2 1 0
router_end
router_begin cpress
router_chan 3 3 1 0
router_end
router_begin kpress
router_chan 0 0 1 0
router_end
router_begin kpress
router_chan 2 2 1 0
router_end
router_begin kpress
router_chan 3 3 1 0
router_end

# Chords (ch1) and arp (ch3) use gamebreaks.sf2: stabs built from the gamestabs
# samples, plus a looped synth. It loads as font 2 with bank offset 1 so its
# presets don't shadow GeneralUser's GM programs. `select <chan> 2 1 <preset>`:
# 0 smet_nor3, 1 toa_f, 2 toa_fm2, 3 toa_lif, 4 toa_ns, 5 toa_oue,
# 6 tyr_sav, 7 tyr_sav2, 8 vk_cfh2, 9 vk_sos (one-shot stabs),
# 10 phase_sine (sustained sine, soft-clipped, through a 1.6 s phaser sweep).
# (Back to GM: `prog 0 4` for chords, `prog 2 11` for arp.) After a change,
# `systemctl --user restart m00dr-fluidsynth`.
load /home/emin0r/code/m800Dr/synths/gamebreaks.sf2 0 1
select 0 2 1 10
select 2 2 1 1

# Drums (ch4, m00Dr's DRUM_CHANNEL) use gamedrums.sf2 (font 3): kits sliced from the GAMEBREAKS drum
# breaks by tools/build_drumkit.py, all in bank 128 on GM drum keys. Preset 0
# is the best-of kit; 1-15 are each cut from one break (see the build output):
# 1 alisia_st4a, 2 eve_hacking, 3 tj&e2_peabo, 4 mcd_moon, 5 exo_st4b,
# 6 crusader_d3, 7 surprise_battlefieldb, 8 hardcorps_locked, 9 eve_office,
# 10 midnight_forest, 11 lagrange_tum, 12 dracx_ship, 13 exo_st4a,
# 14 irritating_results, 15 sor2_bar. `select 3 3 128 <kit>` to switch.
load /home/emin0r/code/m800Dr/synths/gamedrums.sf2
select 3 3 128 0

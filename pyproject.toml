[project]
name = "m00dr"
version = "0.1.0"
description = "m00Dr: a generative MIDI rig that plays itself (composer, SunVox voices, mixer, producer)"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.2",
    "python-rtmidi>=1.5.8",
    # brain/ (roller, producer)
    "alsa-midi>=1.0.4 ; sys_platform == 'linux'",
    "websockets>=17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["composer/moodr", "brain"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
gui-eval = [
    "customtkinter>=6.0.0",
]

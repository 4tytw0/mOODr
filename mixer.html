<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Server Mixer</title>
<style>
  :root { --bg:#f4f4f2; --fg:#1b1b1b; --dim:#6b6b6b; --line:#d4d4d0; --accent:#e8501e; --ok:#2f9e5a; --track:#e6e6e2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#ececec; --dim:#8a8a8a; --line:#2c2c2c; --ok:#4cc27a; --track:#1c1c1c; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:15px/1.4 ui-monospace, "SF Mono", Menlo, monospace; padding:16px; }
  main { width:100%; max-width:640px; display:grid; gap:18px; }
  h1 { margin:0; font-size:20px; letter-spacing:.08em; }
  h1 span { color:var(--accent); }
  h1 .nav { float:right; font-size:13px; color:var(--dim); text-decoration:none; letter-spacing:.12em; padding-top:4px; }
  h1 .nav:hover { color:var(--fg); }
  #strips { display:grid; grid-template-columns:repeat(auto-fit, minmax(64px, 1fr)); gap:10px; }
  .strip { display:grid; gap:8px; justify-items:center; padding:12px 6px; border:1px solid var(--line); border-radius:8px; }
  .strip.hot { border-color:var(--accent); }
  .name { font-size:13px; letter-spacing:.12em; text-transform:uppercase; }
  .ch { font-size:11px; color:var(--dim); }
  .tracks { display:flex; gap:6px; height:260px; }
  /* Fader: fill from the bottom to the position; the band above the knee is the drive zone. */
  .fader { position:relative; width:34px; background:var(--track); border-radius:4px; overflow:hidden;
           cursor:ns-resize; touch-action:none; user-select:none; -webkit-user-select:none; }
  .fader.held { outline:2px solid var(--accent); outline-offset:2px; }
  .fader .zone { position:absolute; left:0; right:0; top:0; background:repeating-linear-gradient(-45deg,
                 transparent 0 4px, color-mix(in srgb, var(--accent) 22%, transparent) 4px 8px); }
  .fader .fill { position:absolute; left:0; right:0; bottom:0; background:var(--fg); opacity:.85; }
  .fader .fill.drive { background:var(--accent); opacity:1; }
  .fader .knee { position:absolute; left:0; right:0; height:2px; background:var(--accent); }
  .meter { position:relative; width:6px; background:var(--track); border-radius:3px; overflow:hidden; }
  .meter i { position:absolute; left:0; right:0; bottom:0; background:var(--ok); transition:height 60ms linear; }
  .meter i.clip { background:var(--accent); }
  .db { font-size:12px; min-height:1.4em; }
  .drv { font-size:11px; color:var(--accent); min-height:1.4em; letter-spacing:.08em; }
  #status { color:var(--dim); font-size:13px; min-height:1.4em; }
  .sc { font-size:11px; color:var(--dim); min-height:1.4em; letter-spacing:.08em; }
  .sc.on { color:var(--fg); }
  #sidechain { display:grid; gap:6px; color:var(--dim); font-size:13px; }
  #sidechain b { color:var(--fg); font-weight:normal; }
  #sidechain input { width:100%; accent-color:var(--accent); }
  /* Embedded in the audio server page: no title, no centring, no gutter. */
  .embed body { display:block; min-height:0; padding:0; }
  .embed h1 { display:none; }
  .embed main { max-width:none; }
  .embed .tracks { height:380px; }   /* beside the scope there's room for long throws */
</style>
</head>
<body>
<main>
  <h1>MIXER <span>●</span> FADERS <a class="nav" href="/">← AUDIO SERVER</a></h1>
  <label id="sidechain">Sidechain: drums duck chords, bass, arp, acid <b id="scv"></b>
    <input id="sc" type="range" min="0" max="100" value="60"></label>
  <div id="strips"></div>
  <div id="status">Connecting…</div>
</main>
<script>
const $ = id => document.getElementById(id);
if (location.search.includes('embed')) {
  document.documentElement.classList.add('embed');
  new ResizeObserver(() => parent.postMessage({ mixerHeight: document.querySelector('main').scrollHeight + 4 }, '*'))
    .observe(document.querySelector('main'));
}
const strips = {};   // name -> {el, fader, fill, meter, db, drv, level, held, knee}

function build(s, knee) {
  const el = document.createElement('div');
  el.className = 'strip';
  el.innerHTML = `<div class="name">${s.name}</div><div class="ch">F${s.number} · CH ${s.channel}</div>
    <div class="tracks">
      <div class="fader"><div class="zone" style="height:${(1 - knee) * 100}%"></div>
        <div class="fill"></div><div class="knee" style="bottom:${knee * 100}%"></div></div>
      <div class="meter"><i></i></div>
    </div>
    <div class="db"></div><div class="drv"></div><div class="sc"></div>`;
  $('strips').append(el);
  const v = strips[s.name] = { el, fader: el.querySelector('.fader'), fill: el.querySelector('.fill'),
                               meter: el.querySelector('.meter i'), db: el.querySelector('.db'),
                               drv: el.querySelector('.drv'), sc: el.querySelector('.sc'),
                               level: 0, held: false, knee };
  draggable(s.name, v);
  return v;
}

// Dragging a fader (mouse or touch) posts its position to the mixer, at most
// every 30 ms; while held, polled state doesn't fight the pointer.
function draggable(name, v) {
  let last = 0, timer = null, value = 0;
  const post = () => {
    timer = null; last = Date.now();
    fetch('/mixer/control', { method: 'POST', body: JSON.stringify({ strip: name, fader: value }) });
  };
  const move = e => {
    const r = v.fader.getBoundingClientRect();
    value = Math.min(1, Math.max(0, (r.bottom - e.clientY) / r.height));
    show(v, value);
    if (!timer) timer = setTimeout(post, Math.max(0, 30 - (Date.now() - last)));
  };
  v.fader.addEventListener('pointerdown', e => {
    v.held = true; v.fader.classList.add('held'); v.fader.setPointerCapture(e.pointerId); move(e);
  });
  v.fader.addEventListener('pointermove', e => { if (v.held) move(e); });
  const release = () => { v.held = false; v.fader.classList.remove('held'); };
  v.fader.addEventListener('pointerup', release);
  v.fader.addEventListener('pointercancel', release);
  // Double-click/tap back to unity.
  v.fader.addEventListener('dblclick', () => {
    value = v.knee; show(v, value); post();
  });
}

const gainOf = (x, knee) => Math.min(x / knee, 1) ** 2;
const driveOf = (x, knee) => Math.max(x - knee, 0) / (1 - knee);

function show(v, x) {
  const g = gainOf(x, v.knee), d = driveOf(x, v.knee);
  v.fill.style.height = (x * 100) + '%';
  v.fill.classList.toggle('drive', d > 0);
  v.el.classList.toggle('hot', d > 0);
  v.db.textContent = g > 0 ? (20 * Math.log10(g)).toFixed(1) + ' dB' : '−∞';
  v.drv.textContent = d > 0 ? `DRIVE ${Math.round(d * 100)}%` : '';
}

function render(state) {
  for (const s of state.strips) {
    const v = strips[s.name] || build(s, state.knee);
    if (!v.held) show(v, s.fader);
    // How far the sidechain pulled this strip down in the last 100 ms.
    if (s.duck !== null && s.duck !== undefined) {
      const db = 20 * Math.log10(Math.max(s.duck, 1e-4));
      v.sc.textContent = db < -0.5 ? `SC ${db.toFixed(1)} dB` : 'SC';
      v.sc.classList.toggle('on', db < -0.5);
    }
    // Peak meter on a 60 dB scale, falling back slowly.
    const db = s.peak > 0 ? 20 * Math.log10(s.peak) : -60;
    v.level = Math.max((Math.max(db, -60) + 60) / 60, v.level * 0.85);
    v.meter.style.height = (v.level * 100) + '%';
    v.meter.classList.toggle('clip', s.peak >= 0.99);
  }
  if (!scHeld && state.sidechain !== undefined) {
    $('sc').value = Math.round(state.sidechain * 100);
    $('scv').textContent = scLabel(state.sidechain);
  }
  const age = Date.now() / 1000 - state.time;
  const cc = state.last_cc ? ` · last unmapped CC: ch ${state.last_cc[0]} cc ${state.last_cc[1]} = ${state.last_cc[2]}` : '';
  $('status').textContent = age > 2 ? 'Mixer not running' : `Drag a fader, or move it on the controller · double-click = unity · F = Launch Control XL fader (CC 77–84) · CH = MIDI channel (CC ${state.cc})${cc}`;
}

// Sidechain amount: the slider posts while dragged; polling won't fight it.
let scHeld = false, scTimer = null;
const scLabel = x => x > 0 ? `up to ${(20 * Math.log10(1 - x * 0.999)).toFixed(1)} dB` : 'off';
$('sc').addEventListener('pointerdown', () => scHeld = true);
addEventListener('pointerup', () => scHeld = false);
$('sc').addEventListener('input', () => {
  const x = $('sc').value / 100;
  $('scv').textContent = scLabel(x);
  clearTimeout(scTimer);
  scTimer = setTimeout(() => fetch('/mixer/control', { method: 'POST', body: JSON.stringify({ sidechain: x }) }), 30);
});

async function poll() {
  try {
    const r = await fetch('/mixer/state', { cache: 'no-store' });
    if (r.ok) render(await r.json());
    else $('status').textContent = 'Mixer not running';
  } catch { $('status').textContent = 'Audio server unreachable'; }
  setTimeout(poll, 100);
}
poll();
</script>
</body>
</html>
